[project]
name = "sub2api-auto-synchronous"
version = "0.4.0"
description = "Periodically synchronize Sub2API groups, billing multipliers, and relay accounts."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "cryptography>=44",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "playwright>=1.50,<2"]

[project.scripts]
sub2api-flow = "web_app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["sync_sub2api", "provider_ranking", "web_app"]

[tool.setuptools.packages.find]
include = ["relaydesk*"]

[tool.setuptools.package-data]
relaydesk = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
